# Zscaler Admin UI: nginx vHost (SUSE: /etc/nginx/vhosts.d/zscaler-admin-ui.conf)
#
# Own server_name, own certificate, proxies to the backend on port 8001.
# Shares ports 80/443 with other vHosts without conflicting with them.
#
# IMPORTANT: the WebSocket upgrade is required for the live stream (/api/stream/ws).

# Only set the upgrade header when the client actually asks for an upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name zscaler-admin.example.com;
    # Redirect plain HTTP to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zscaler-admin.example.com;

    # TLS (certificate from your own CA or from Let's Encrypt)
    ssl_certificate     /etc/ssl/zscaler-admin-ui/fullchain.pem;
    ssl_certificate_key /etc/ssl/zscaler-admin-ui/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # CSP: own origin only; ws/wss for the live stream; inline styles (React style={{}}).
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade (the live view keeps the connection open).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Do not cut off long-lived streams early (the WebSocket sends stats about every 2.5s).
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
    }
}
